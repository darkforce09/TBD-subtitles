# Repeatable local visual recognition and artifact acceptance checks.
[package]
name = "visual_validation"
description = "Validation harness for on-screen translation"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
inference = { path = "../../crates/inference" }
job_model = { path = "../../crates/job_model" }
stages = { path = "../../crates/stages" }
media_io = { path = "../../crates/media_io" }
pipeline = { path = "../../crates/pipeline" }
# The job database's table names, for the per-frame rows the probes read.
worker_channel = { path = "../../crates/worker_channel" }
subtitle_formats = { path = "../../crates/subtitle_formats" }
child_process = { path = "../../crates/child_process" }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
