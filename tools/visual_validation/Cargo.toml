# Repeatable local visual recognition and artifact acceptance checks.
[package]
name = "visual_validation"
description = "Validation harness for on-screen translation"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
inference = { path = "../../crates/inference" }
job_model = { path = "../../crates/job_model" }
stages = { path = "../../crates/stages" }
media_io = { path = "../../crates/media_io" }
pipeline = { path = "../../crates/pipeline" }
# The job database's table names, for the per-frame rows the probes read.
worker_channel = { path = "../../crates/worker_channel" }
subtitle_formats = { path = "../../crates/subtitle_formats" }
child_process = { path = "../../crates/child_process" }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
# The detection benchmark: PP-OCRv5 detection predictors and their DB model, pre- and
# post-processing pieces, on the same ONNX Runtime the inference crate loads.
oar-ocr = { version = "=0.9.2", default-features = false, features = ["cuda"] }
# The detection benchmark's batch tensors, the version oar-ocr uses.
ndarray = "0.17"
# The detection benchmark's parallel post-processing and colour conversion.
rayon = "1"
# The detection benchmark's pipe size (`F_SETPIPE_SZ`).
libc = { version = "0.2", default-features = false }
# The detection benchmark's box overlays on full-resolution frames.
imageproc = { version = "0.26", default-features = false }
# The detection benchmark's GPU and NVDEC utilisation, read from the driver's NVML.
nvml-wrapper = { version = "0.13", default-features = false }
