# The stack spike's worker for the local language model (mistral.rs). It is a binary of its own
# because candle's CUDA runtime and ONNX Runtime corrupt each other's heap when loaded into one
# process; `stack-spike` starts it for the local language-model item.
[package]
name = "stack_spike_llm"
description = "The stack spike's local language-model worker: mistral.rs adjudication"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[[bin]]
name = "stack-spike-llm"
path = "src/main.rs"

[features]
# Links mistral.rs with CUDA; its build needs the CUDA 13.3 compiler and the 13.4 libraries on
# `LIBRARY_PATH`. Without it the binary builds and reports that it cannot run the item.
mistralrs = ["inference/mistralrs"]

[dependencies]
# The mistral.rs backend and the models folder.
inference = { path = "../../crates/inference" }
# The probe result, for the video's length.
job_model = { path = "../../crates/job_model" }
# The diff sheet and the adjudication with its checks.
stages = { path = "../../crates/stages" }
# Error context at the top of the binary.
anyhow = "1"
# The `worker` command.
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
# The result files in the work folder.
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = "1"
