# The redb process probe: proves how redb behaves when a second process opens a database file
# that another process holds open or is writing, and that an rkyv archive reads in place from a
# redb value, and measures the RAM one large write transaction holds. Nothing depends on it; its
# output feeds the redb research notes.
[package]
name = "redb_process_probe"
description = "Proves how redb 4.3.0 behaves when a second process opens the same database file"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[[bin]]
name = "redb-process-probe"
path = "src/main.rs"

[features]
# Builds redb with its experimental multi-process sharing modes, so `--sharing` can pick
# single-writer or multi-writer; without it every open is redb's default exclusive writer.
multiprocess = ["redb/experimental-multiprocess"]

[dependencies]
# The database under test, pinned exactly: the findings hold for this version only. Keep
# `REDB_VERSION` in `src/main.rs` equal to this pin.
redb = "=4.3.0"
# The archive read in place from a redb value slice, in the job model's format: `unaligned`, so
# an archive has alignment 1 and reads at any address, little-endian, 32-bit lengths and `usize`.
rkyv = { version = "0.8.18", features = ["unaligned", "little_endian", "pointer_width_32"] }
# Error context at the top of the binary.
anyhow = "1"
# The subcommands `hold`, `attempt`, `matrix`, `inplace` and `txn-memory`.
clap = { version = "4.6", features = ["derive"] }
