# One module folder per pipeline stage. Each stage reads its inputs from the job's work directory,
# does its work through media_io, inference and subtitle_formats, and writes a typed output.
[package]
name = "stages"
description = "The pipeline stages, from probe to subtitle file"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[features]
# Whisper and the Qwen3 aligner through CrispASR (ggml with CUDA).
crispasr = ["inference/crispasr"]

[dependencies]
# Media input: probing, PCM audio, shot changes.
media_io = { path = "../media_io" }
# The model backends the GPU stages run.
inference = { path = "../inference" }
# Carries the caller's span onto the threads that call the language model, so the app's log window
# shows those calls under their video.
tracing = { version = "0.1", default-features = false, features = ["std"] }
# The cue model and the file writers.
subtitle_formats = { path = "../subtitle_formats" }
# Stage names and the contract types.
job_model = { path = "../job_model" }
# The diff sheet is written as JSON beside its text.
serde = { version = "1", default-features = false, features = ["std", "derive"] }
# The earshot voice-activity detector (pure Rust).
earshot = "1"
# The language models' JSON answers.
serde_json = "1"
# Pixel buffers, crop files and perspective rectification for visible writing.
image = { version = "0.25", default-features = false, features = ["png"] }
imageproc = { version = "0.26", default-features = false }
# Pure-Rust robust geometric fitting.
nalgebra = "0.34"
fontdb = "0.23"
ttf-parser = "0.25"
# Anti-aliased rasterizing of English lettering onto inpainted plates (pure Rust).
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
# Crop content for tool-disabled Claude image requests.
base64 = "0.22"
# The AudioSet rated label table, to name the tagger's 527 outputs.
soundevents-dataset = { version = "0.4", default-features = false, features = ["std", "rated"] }
