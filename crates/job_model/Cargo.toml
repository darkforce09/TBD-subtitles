# The types every stage reads and writes: jobs, stage names, stage outputs and reports, written
# as JSON and archived with rkyv. The contracts between stages live here, below every other crate.
[package]
name = "job_model"
description = "Job, stage and report types shared by every TBD-subtitles crate"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
sha2 = "0.10"
# Every contract type is written to and read from the job's work directory as JSON.
serde = { version = "1", default-features = false, features = ["std", "derive"] }
# A model call crosses from a worker to the app as one JSON line.
serde_json = "1"
# Every contract type is also archived with rkyv for the job database; `unaligned` gives archived
# types alignment 1 so a record is read in place from a redb value at any offset. The format is
# named in full, little-endian with 32-bit lengths and `usize`, so no other crate's features can
# change it through Cargo's feature unification: rkyv refuses to compile with two pointer widths,
# two endiannesses or both alignments enabled.
rkyv = { version = "0.8.18", features = ["unaligned", "little_endian", "pointer_width_32"] }
