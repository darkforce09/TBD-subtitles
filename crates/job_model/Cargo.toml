# The serde types every stage reads and writes: jobs, stage names, stage outputs and reports. The
# contracts between stages live here, below every other crate.
[package]
name = "job_model"
description = "Job, stage and report types shared by every TBD-subtitles crate"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
sha2 = "0.10"
# Every contract type is written to and read from the job's work directory as JSON.
serde = { version = "1", default-features = false, features = ["std", "derive"] }
# A model call crosses from a worker to the app as one JSON line.
serde_json = "1"
