# The inference backends behind traits: ONNX Runtime, ggml and candle models, the language-model
# backends, the model store and the CUDA runtime locator.
[package]
name = "inference"
description = "Inference backends, the model store and the CUDA runtime locator"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[features]
# Whisper and the Qwen3 aligner through CrispASR: builds ggml with CUDA, so it needs cmake and nvcc.
crispasr = ["dep:crispasr"]
# A local language model through mistral.rs with CUDA; its build accepts CUDA toolkits up to 13.3.
mistralrs = ["dep:mistralrs", "dep:tokio"]

[dependencies]
# Runs FFmpeg, ffprobe and the other external programs with deadlines.
child_process = { path = "../child_process" }
# A summary of each language-model call (model, sizes, time, tokens) as a `tracing` event, for the
# app's log window; never the prompt or the answer.
tracing = { version = "0.1", default-features = false, features = ["std"] }
# Stage names and the contract types.
job_model = { path = "../job_model" }
# The language models' JSON answers and schemas.
serde_json = "1"
# Unpacks the gzip-compressed ONNX Runtime archive; the pure-Rust backend.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Unpacks NVIDIA's .tar.xz runtime archives without an xz program or a C library.
lzma-rs = { version = "0.3", default-features = false }
# ONNX Runtime for separation, CTC alignment and sound events, loaded at run time from Microsoft's
# CUDA 13 build in the runtime folder: the prebuilt static library needs a newer glibc and
# libstdc++ than the build container has, and a loaded library links nowhere at build time.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "api-28", "cuda", "load-dynamic"] }
# Parakeet-TDT: its feature extraction, TDT decoding and word timing, on this crate's `ort`.
parakeet-rs = { version = "0.3.8", default-features = false, features = ["cuda", "load-dynamic", "api-28"] }
# Parakeet-CTC's own BPE tokenizer (`tokenizer.json`); the version parakeet-rs already uses.
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
# The short-time Fourier transforms around the separation models.
realfft = "3"
# CrispASR (ggml): Whisper and the Qwen3 forced aligner on CUDA. The crates.io package ships no C++
# sources, so the pinned git tag is built with cmake; optional, behind the `crispasr` feature.
crispasr = { git = "https://github.com/CrispStrobe/CrispASR", tag = "v0.8.37", features = ["cuda"], optional = true }
# mistral.rs (candle, pure Rust) for the local language model, from the pinned git tag: Qwen3.5
# GGUF support is not on crates.io yet. Optional, behind the `mistralrs` feature.
mistralrs = { git = "https://github.com/EricLBuehler/mistral.rs", tag = "v0.9.4", default-features = false, features = ["cuda"], optional = true }
# Checks every downloaded file against its pinned SHA-256.
sha2 = { version = "0.11", default-features = false }
# Reads the runtime archives once lzma-rs has decompressed them.
tar = { version = "0.4", default-features = false }
# The runtime the async mistral.rs API is driven with.
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"], optional = true }
# Downloads model files and runtime archives over https, with resumable ranges.
ureq = { version = "3", default-features = false, features = ["rustls"] }
