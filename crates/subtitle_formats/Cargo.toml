# The cue model and the subtitle file formats: writers for SRT, WebVTT and ASS, and import of
# existing subtitle files.
[package]
name = "subtitle_formats"
description = "Cue model, SRT, WebVTT and ASS writers, subtitle import"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
# Stage names and the contract types.
job_model = { path = "../job_model" }
# Cues are stored as JSON in the job's work directory.
serde = { version = "1", default-features = false, features = ["std", "derive"] }
# Cues are also archived with rkyv for the job database. The format is named in full, exactly as in
# `job_model`, so no feature unification can change it.
rkyv = { version = "0.8.18", features = ["unaligned", "little_endian", "pointer_width_32"] }

[dev-dependencies]
# Round-trips cue tracks through JSON in the tests.
serde_json = "1"
