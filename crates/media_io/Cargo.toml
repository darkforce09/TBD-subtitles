# Media through FFmpeg and ffprobe, run as child processes: probing, streaming PCM audio and
# timestamped video frames in bounded chunks, region crops, shot changes, preview frames and the
# localized video's encode. No libav is linked.
[package]
name = "media_io"
description = "FFmpeg and ffprobe as child processes: probe, PCM streaming, shot changes"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
# Runs FFmpeg, ffprobe and the other external programs with deadlines.
child_process = { path = "../child_process" }
# Stage names and the contract types.
job_model = { path = "../job_model" }
# ffprobe's JSON output, read into the probe result.
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = "1"
