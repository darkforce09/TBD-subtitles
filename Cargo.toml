# The TBD-subtitles workspace: the app, its library crates and the repository tools. Every member
# sets its own edition, rust-version and publish flag; see the coding standards.
[workspace]
resolver = "3"
members = [
    "apps/tbd_subtitles",
    "apps/tbd_subtitles_ggml",
    "apps/tbd_subtitles_llm",
    "crates/app_icon",
    "crates/child_process",
    "crates/inference",
    "crates/job_model",
    "crates/media_io",
    "crates/pipeline",
    "crates/stages",
    "crates/subtitle_formats",
    "crates/worker_channel",
    "tools/appimage_builder",
    "tools/redb_process_probe",
    "tools/repo_gates",
    "tools/stack_spike",
    "tools/stack_spike_ggml",
    "tools/stack_spike_llm",
    "tools/verification_core",
    "tools/visual_validation",
]
