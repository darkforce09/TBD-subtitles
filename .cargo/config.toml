# `cargo gates` runs every repository gate; `cargo gates <gate>` runs one. See tools/repo_gates.
[alias]
gates = "run --quiet --package repo_gates --"
# `cargo appimage` builds the app and packs dist/TBD-subtitles-…-x86_64.AppImage. See tools/appimage_builder.
appimage = "run --release --package appimage_builder --"
